env: development
grpc_port: 9005
log_level: debug

postgres:
  max_conns: 5
  min_conns: 1
  conn_max_lifetime_minutes: 30

gemini:
  llm:
    model: gemini-3.5-flash-lite
  embedding:
    model: gemini-embedding-001
    dimensions: 768
  max_retries: 3
  retry_base_delay_ms: 250

mcp:
  server_url: http://localhost:9006/mcp
  client:
    name: nexus-scheduler-chatbot
    version: 1.0.0

chunking:
  strategy_fixed:
    chunk_size: 500
    overlap: 75
    min_chunk_size: 50

pinecone:
  index_host: your-pinecone-index-host