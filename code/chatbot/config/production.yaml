env: production
grpc_port: 9005
log_level: warn

postgres:
  max_conns: 25
  min_conns: 5
  conn_max_lifetime_minutes: 60

gemini:
  llm:
    model: gemini-3.5-flash-lite
  embedding:
    model: gemini-embedding-001
    dimensions: 768
  max_retries: 3
  retry_base_delay_ms: 250

mcp:
  client:
    name: nexus-scheduler-chatbot
    version: 1.0.0

chunking:
  strategy_fixed:
    chunk_size: 500
    overlap: 75
    min_chunk_size: 50

pinecone:
  index_host: https://nexus-schedular-t7xqywr.svc.aped-4627-b74a.pinecone.io
  namespace: resource-docs