services:
  # ── Redis ──────────────────────────────────────────────────────────
  - type: keyvalue
    name: nexus-redis
    plan: starter
    ipAllowList: []

  # ── Identity (private gRPC) ────────────────────────────────────────
  - type: pserv
    name: identity
    runtime: go
    plan: starter
    buildCommand: go build -tags netgo -ldflags '-s -w' -o app ./code/identity
    startCommand: ./app
    envVars:
      - key: ENV
        value: production
      - key: IDENTITY_POSTGRES_DSN
        sync: false
      - key: REDIS_URL
        fromService:
          name: nexus-redis
          type: keyvalue
          property: connectionString

  # ── Resource (private gRPC) ────────────────────────────────────────
  - type: pserv
    name: resource
    runtime: go
    plan: starter
    buildCommand: go build -tags netgo -ldflags '-s -w' -o app ./code/resource
    startCommand: ./app
    envVars:
      - key: ENV
        value: production
      - key: LOCATIONIQ_API_KEY
        sync: false
      - key: RESOURCE_POSTGRES_DSN
        sync: false
      - key: REDIS_URL
        fromService:
          name: nexus-redis
          type: keyvalue
          property: connectionString

  # ── Booking (private gRPC) ─────────────────────────────────────────
  - type: pserv
    name: booking
    runtime: go
    plan: starter
    buildCommand: go build -tags netgo -ldflags '-s -w' -o app ./code/booking
    startCommand: ./app
    envVars:
      - key: ENV
        value: production
      - key: BOOKING_POSTGRES_DSN
        sync: false
      - key: REDIS_URL
        fromService:
          name: nexus-redis
          type: keyvalue
          property: connectionString
      - key: RISU_API_KEY
        sync: false

  # ── Chatbot (private gRPC + MCP client) ─────────────────────────────
  - type: pserv
    name: chatbot
    runtime: go
    plan: starter
    buildCommand: go build -tags netgo -ldflags '-s -w' -o app ./code/chatbot
    startCommand: ./app
    envVars:
      - key: ENV
        value: production
      - key: CHATBOT_POSTGRES_DSN
        sync: false
      - key: GEMINI_LLM_API_KEY
        sync: false
      - key: MCP_SERVER_URL
        sync: false

  # ── MCP Server (private HTTP) ──────────────────────────────────────
  - type: pserv
    name: nexus-mcp
    runtime: go
    plan: starter
    buildCommand: go build -tags netgo -ldflags '-s -w' -o app ./code/mcp
    startCommand: ./app
    envVars:
      - key: ENV
        value: production
      - key: MCP_HTTP_PORT
        value: "9006"
      - key: API_GATEWAY_BASE_URL
        sync: false

  # ── API Gateway (public REST HTTP) ──────────────────────────────────
  - type: web
    name: api-gateway
    runtime: go
    plan: starter
    buildCommand: go build -tags netgo -ldflags '-s -w' -o app ./code/api-gateway
    startCommand: ./app
    envVars:
      - key: ENV
        value: production
      - key: API_GATEWAY_JWT_SECRET
        generateValue: true

      # Redis
      - key: REDIS_URL
        fromService:
          name: nexus-redis
          type: keyvalue
          property: connectionString

      # Internal gRPC service addresses
      - key: IDENTITY_GRPC_ADDR
        fromService:
          name: identity
          type: pserv
          property: hostport

      - key: RESOURCE_GRPC_ADDR
        fromService:
          name: resource
          type: pserv
          property: hostport

      - key: BOOKING_GRPC_ADDR
        fromService:
          name: booking
          type: pserv
          property: hostport

      - key: CHATBOT_GRPC_ADDR
        fromService:
          name: chatbot
          type: pserv
          property: hostport