services:
  # ── Redis ──────────────────────────────────────────────────────────
  - type: keyvalue
    name: nexus-redis
    plan: starter
    ipAllowList: []

  # ── Identity ──────────────────────────────────────────────────────
  - type: pserv
    name: identity
    runtime: docker
    plan: starter
    dockerfilePath: ./Dockerfile
    dockerContext: .
    dockerCommand: identity
    envVars:
      - key: ENV
        value: production
      - key: IDENTITY_POSTGRES_DSN
        sync: false
      - key: REDIS_URL
        fromService:
          name: nexus-redis
          type: keyvalue
          property: connectionString

  # ── Resource ──────────────────────────────────────────────────────
  - type: pserv
    name: resource
    runtime: docker
    plan: starter
    dockerfilePath: ./Dockerfile
    dockerContext: .
    dockerCommand: resource
    envVars:
      - key: ENV
        value: production
      - key: LOCATIONIQ_API_KEY
        sync: false
      - key: RESOURCE_POSTGRES_DSN
        sync: false
      - key: REDIS_URL
        fromService:
          name: nexus-redis
          type: keyvalue
          property: connectionString

  # ── Booking ───────────────────────────────────────────────────────
  - type: pserv
    name: booking
    runtime: docker
    plan: starter
    dockerfilePath: ./Dockerfile
    dockerContext: .
    dockerCommand: booking
    envVars:
      - key: ENV
        value: production
      - key: BOOKING_POSTGRES_DSN
        sync: false
      - key: REDIS_URL
        fromService:
          name: nexus-redis
          type: keyvalue
          property: connectionString
      - key: RISU_API_KEY
        sync: false

  # ── Chatbot ────────────────────────────────────────────────────────
  - type: pserv
    name: chatbot
    runtime: docker
    plan: starter
    dockerfilePath: ./Dockerfile
    dockerContext: .
    dockerCommand: chatbot
    envVars:
      - key: ENV
        value: production
      - key: CHATBOT_POSTGRES_DSN
        sync: false
      - key: GEMINI_LLM_API_KEY
        sync: false
      - key: MCP_SERVER_HOST
        fromService:
          name: nexus-mcp
          type: pserv
          property: hostport

  # ── MCP Server ────────────────────────────────────────────────────
  - type: pserv
    name: nexus-mcp
    runtime: docker
    plan: starter
    dockerfilePath: ./Dockerfile
    dockerContext: .
    dockerCommand: mcp
    envVars:
      - key: ENV
        value: production
      - key: MCP_HTTP_PORT
        value: "9006"
      - key: API_GATEWAY_HOST
        fromService:
          name: api-gateway
          type: web
          property: hostport

  # ── API Gateway ────────────────────────────────────────────────────
  - type: web
    name: api-gateway
    runtime: docker
    plan: starter
    dockerfilePath: ./Dockerfile
    dockerContext: .
    dockerCommand: api-gateway
    envVars:
      - key: ENV
        value: production
      - key: PORT
        value: "10000"
      - key: API_GATEWAY_JWT_SECRET
        generateValue: true
      - key: REDIS_URL
        fromService:
          name: nexus-redis
          type: keyvalue
          property: connectionString

      - key: IDENTITY_GRPC_ADDR
        fromService:
          name: identity
          type: pserv
          property: hostport

      - key: RESOURCE_GRPC_ADDR
        fromService:
          name: resource
          type: pserv
          property: hostport

      - key: BOOKING_GRPC_ADDR
        fromService:
          name: booking
          type: pserv
          property: hostport

      - key: CHATBOT_GRPC_ADDR
        fromService:
          name: chatbot
          type: pserv
          property: hostport